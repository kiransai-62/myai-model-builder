[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myai"
version = "0.1.0"
description = "Local-first AI model builder"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "PyYAML>=6.0.1",
    "psutil>=5.9.8",
]

[project.optional-dependencies]
models = ["huggingface_hub>=0.23.0"]
train = [
    "torch>=2.3.0",
    "transformers>=4.43.0",
    "peft>=0.11.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.30.0",
]
retrieval = ["sentence-transformers>=3.0.0"]
knowledge = ["numpy>=1.24.0"]
serving = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "requests>=2.31.0",
]
serve = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "requests>=2.31.0",
]
eval = [
    "textstat>=0.7.3",
    "nltk>=3.8.1",
    "rouge-score>=0.1.2",
]
dev = ["pytest>=8.2.0"]

[project.scripts]
myai = "myai.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
myai = ["registry/models/**/*.yaml", "registry/models/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]