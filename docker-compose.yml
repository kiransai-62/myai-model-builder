version: '3.8'

services:
  myai-runtime:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount your project directory
      - ./fittrack-ai:/project
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
