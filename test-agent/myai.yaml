project:
  name: test-agent
goal:
  task: instruction-tuning
  domain: general
  context_priority: balanced
  latency_priority: balanced
  target_deployment: local-cpu-gpu
data:
  path: data
  dataset_id: ''
model:
  model_id: ''
training:
  method: qlora
  task: sft
  epochs: 3
  batch_size: 4
  grad_accum: 4
  learning_rate: 0.0002
  seq_length: 1024
  stream_layers: false
  stream_source: ram
gate:
  threshold: 0.6
  top_k: 3
evaluation:
  eval_split: 0.1
  seed: 42
  knowledge_min: 0.8
  task_min: 0.8
  regression_min: 0.95
  overall_min: 0.85
